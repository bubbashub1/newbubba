<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bump | Bubba Hub</title>
<link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/hub.css">
<script src="../assets/js/app.js" defer></script><script src="../assets/js/hub-bump.js" defer></script>
</head>
<body data-page="hub-bump"><div id="site-header"></div>
<main class="hub-page"><div class="container">
<section class="hub-page-hero"><a class="hub-back" href="/my-hub.html">← My Hub</a><span class="eyebrow">Pregnancy profile</span><h1>My Bump</h1><p>Keep your pregnancy details in one place and get ready for your baby's arrival.</p></section>
<section class="hub-panel"><div class="hub-panel-head"><div><span class="eyebrow">Your pregnancy</span><h2>My Bump</h2></div></div>
<form class="app-form" data-bump-form>
<div class="hub-form-grid">
<label>Nickname<input name="nickname" type="text" maxlength="60" placeholder="e.g. Baby Bean"></label>
<label>Due date<input name="due_date" type="date"></label>
</div>
<div class="hub-permission"><div><strong>Baby is here</strong><p>We'll automatically show this when your pregnancy reaches 38 weeks, or you can switch it on yourself.</p></div><label><input type="checkbox" name="baby_here"> Baby is here</label></div>
<button class="button" type="submit">Save bump details</button>
<div class="form-message" data-bump-message aria-live="polite"></div>
</form></section>
<section class="hub-panel" data-bump-status></section>
</div></main><div id="site-footer"></div></body></html>

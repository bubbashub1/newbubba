<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/app-pages.css"><script src="/assets/js/app.js" defer></script><script src="/assets/js/account.js" defer></script></head><body data-page="account"><div id="site-header"></div><main class="section-page"><div class="container narrow"><section class="section-hero"><h1>My Account</h1><p>Sign in or create your free Bubba Hub account.</p></section><form class="app-form" data-account-form><input type="hidden" name="csrf"><input type="hidden" name="action" value="login" data-auth-mode><div class="field"><label for="account-name">Name</label><input id="account-name" name="name" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="account-email">Email address</label><input id="account-email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="account-password">Password</label><input id="account-password" name="password" type="password" required minlength="8" autocomplete="current-password"></div><div class="form-actions"><button class="button" type="submit" data-auth-submit>Sign in</button><button class="button button-secondary" type="button" data-register>New account</button></div><div class="form-message" data-form-message aria-live="polite"></div></form></div></main><div id="site-footer"></div><script>document.addEventListener("DOMContentLoaded",()=>document.querySelector("[data-register]")?.addEventListener("click",()=>{const m=document.querySelector("[data-auth-mode]"),b=document.querySelector("[data-auth-submit]"),n=document.querySelector("[name=name]");m.value="register";b.textContent="Create account";n.required=true;n.focus();}));</script></body></html>

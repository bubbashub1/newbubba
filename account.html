<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account | Bubba Hub</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/app.js" defer></script>
</head>
<body data-page="account">
<div id="site-header"></div>
<main>
<section class="page-heading"><div class="container"><h1>My Account</h1><p>Sign in or create your free Bubba Hub account.</p></div></section>
<section class="page-section"><div class="container narrow"><div class="card"><h2>Sign in</h2>
<form>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
<div class="form-actions"><button class="button" type="button">Sign in</button><button class="button button-secondary" type="button">Create account</button></div>
</form>
</div></div></section>
</main>
<div id="site-footer"></div>
</body>
</html>

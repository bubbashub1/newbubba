<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin.css"><script src="/assets/js/app.js" defer></script><script src="/assets/js/admin-auth.js" defer></script></head>
<body data-page="admin"><div id="site-header"></div>
<main class="admin-login-page"><div class="container"><section class="admin-login-card">
<div class="admin-login-icon" aria-hidden="true">🔐</div><p class="eyebrow">Bubba Hub administration</p><h1 data-admin-title>Admin login</h1><p class="admin-login-intro" data-admin-intro>Sign in to manage Bubba Hub.</p>
<form class="app-form" data-admin-form><div class="field"><label for="admin-email">Admin email</label><input id="admin-email" name="email" type="email" required autocomplete="username"></div><div class="field"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" required minlength="12" autocomplete="current-password"></div><div class="field" data-admin-name-field hidden><label for="admin-name">Admin name</label><input id="admin-name" name="name" autocomplete="name" placeholder="Bubba Hub Admin"></div><div class="form-actions"><button class="button" type="submit" data-admin-submit>Sign in</button></div><div class="form-message" data-admin-message aria-live="polite"></div></form>
<p class="admin-login-note" data-admin-note hidden>This is the one-time setup for the first Bubba Hub administrator. Choose a strong password of at least 12 characters. Once an admin exists, this setup option is permanently disabled.</p>
</section></div></main><div id="site-footer"></div></body></html>
